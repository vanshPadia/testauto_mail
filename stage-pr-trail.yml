name: Staging PR Approval Trail

on:
  pull_request:
    branches:
      - staging
    types: [opened, ready_for_review]

jobs:
  notify-approval-trail:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Audit Trail Webhook
        env:
          WEBHOOK_URL: ${{ secrets.APPROVAL_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Error: APPROVAL_WEBHOOK_URL secret is not set!"
            exit 1
          fi

          # Send POST request to Google Apps Script Web App
          python3 -c "
          import os, json, urllib.request

          payload = {
              'action': 'PR_OPENED',
              'pr_number': os.environ.get('PR_NUMBER'),
              'pr_title': os.environ.get('PR_TITLE'),
              'pr_body': os.environ.get('PR_BODY') or 'No description provided.',
              'pr_url': os.environ.get('PR_URL'),
              'author': os.environ.get('PR_AUTHOR'),
              'target_branch': os.environ.get('TARGET_BRANCH')
          }

          req = urllib.request.Request(
              os.environ['WEBHOOK_URL'],
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json'}
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  print('Webhook response:', resp.read().decode())
          except Exception as e:
              print('Error calling webhook:', e)
              raise e
          "
